name: Mwraaahh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bug Fixing
        run: |
          echo "Last active: $(date -u)" > daily_log.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "MwrH000"
          git config --global user.email "nxy.moraa@gmail.com"
          git add log.txt
          git commit -m "Fixing" || echo "No changes to commit"
          git push