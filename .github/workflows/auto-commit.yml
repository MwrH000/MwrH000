name: Streak

on:
  schedule:
    # Runs every day at 00:00 UTC (Adjust time if needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          echo "Last active: $(date -u)" > daily_log.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "Mwrh000"
          git config --global user.email "nxy.moraa@gmail.com"
          git add log.txt
          git commit -m "daily-routine :3" || echo "No changes to commit"
          git push